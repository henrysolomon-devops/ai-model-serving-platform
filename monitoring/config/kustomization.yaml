apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - servicemonitors.yaml
  - rules-infra.yaml
  - rules-model.yaml
configMapGenerator:
  - name: grafana-dashboard-model-serving
    namespace: monitoring
    files:
      - model-serving.json=dashboards/model-serving.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
