{{- $weight := 0 }}
{{- if .Values.canary.enabled }}
{{- $weight = int .Values.canary.weight }}
{{- end }}
{{- if or (lt $weight 0) (gt $weight 100) }}
{{- fail "canary.weight must be between 0 and 100" }}
{{- end }}
# Where the chat UI sends its requests. It splits traffic between the stable
# model and, during a release, the canary.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: model-traffic
  namespace: {{ required "namespace must be set" .Values.namespace }}
spec:
  parentRefs:
    - name: kserve-ingress-gateway
      namespace: kserve
  hostnames:
    - model-service.{{ .Values.namespace }}.svc.cluster.local
  rules:
    - backendRefs:
        - name: model-service-predictor
          port: 80
          weight: {{ sub 100 $weight }}
{{- if .Values.canary.enabled }}
        - name: model-service-canary-predictor
          port: 80
          weight: {{ $weight }}
{{- end }}
      timeouts:
        # KServe's own routes stop at 60 seconds. A long answer needs more.
        request: 120s
