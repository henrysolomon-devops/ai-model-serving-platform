# NodePort must match the security group rule for this port.
apiVersion: v1
kind: Service
metadata:
  name: model-service
  namespace: {{ required "namespace must be set" .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: model-service
  ports:
    - port: {{ .Values.model.port }}
      targetPort: {{ .Values.model.port }}
      nodePort: {{ required "model.nodePort must be set" .Values.model.nodePort }}
