name: Staging smoke test

# Runs after the bot moves staging to a new image. Also runnable by hand
# once the infrastructure is back up. The result is recorded on the
# image's commit, which the canary workflows check.
on:
  push:
    branches: [main]
    paths:
      - helm/ai-model-serving/values-staging.yaml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  statuses: write

concurrency:
  group: smoke-test
  cancel-in-progress: false

env:
  ROLE_ARN: arn:aws:iam::578254188866:role/github-actions-ai-model-serving-role

jobs:
  check-infra:
    runs-on: ubuntu-24.04
    environment: staging
    outputs:
      up: ${{ steps.check.outputs.up }}
      sg: ${{ steps.check.outputs.sg }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: us-east-1

      # The security group only exists while Terraform's infrastructure does.
      - name: Check whether the infrastructure is up
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          sg=$(aws ec2 describe-security-groups \
            --filters Name=group-name,Values=ai-model-serving-sg \
            --query 'SecurityGroups[0].GroupId' --output text)
          tag=$(sed -n 's/^    tag: "\(.*\)"$/\1/p' helm/ai-model-serving/values-staging.yaml | sort -u | head -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$sg" = "None" ]; then
            echo "up=false" >> "$GITHUB_OUTPUT"
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::Infrastructure is down. Run the Infrastructure workflow with apply first."
              exit 1
            fi
            echo "::notice::Infrastructure is down, so the smoke test was skipped."
            exit 0
          fi
          echo "up=true" >> "$GITHUB_OUTPUT"
          echo "sg=$sg" >> "$GITHUB_OUTPUT"

  smoke-test:
    needs: check-infra
    if: needs.check-infra.outputs.up == 'true'
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 60
    env:
      SG: ${{ needs.check-infra.outputs.sg }}
      TAG: ${{ needs.check-infra.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: us-east-1

      - name: Let this runner reach the k3s API, the chat UI and the gateway
        id: access
        run: |
          cidr="$(curl -s ifconfig.me)/32"
          echo "cidr=$cidr" >> "$GITHUB_OUTPUT"
          for port in 6443 8001 8003; do
            aws ec2 authorize-security-group-ingress \
              --group-id "$SG" --protocol tcp --port "$port" --cidr "$cidr"
          done

      # Argo CD polls Git every few minutes, so wait for the new tag to land
      # and for its pod to come up. Rollout status would give up too early:
      # KServe's Deployment has a 10 minute deadline and a cold start can
      # take longer.
      - name: Wait for Argo CD to roll out the tag
        id: rollout
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          # One line per model pod: its image and whether it is ready.
          pods() {
            kubectl get pods -n staging -l serving.kserve.io/inferenceservice=model-service \
              -o jsonpath='{range .items[*]}{.spec.containers[0].image}{" "}{.status.containerStatuses[0].ready}{"\n"}{end}'
          }
          deadline=$((SECONDS + 2400))
          # Exactly one pod, on the new tag and ready, so the old one is gone.
          until [ "$(pods | sed 's/.*://')" = "$TAG true" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Staging never got a ready model pod on ${TAG:0:7}."
              exit 1
            fi
            sleep 20
          done
          kubectl rollout status deployment/chat-ui -n staging --timeout=5m
          ip=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' \
            | sed -E 's|https://([^:]+):.*|\1|')
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Note the request count before the prompt
        run: bash test/metrics-check.sh before staging "$RUNNER_TEMP/metrics-before"

      - name: Run the smoke test
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SERVER_IP: ${{ steps.rollout.outputs.ip }}
        run: bash test/smoke-test.sh staging "$SERVER_IP" "$API_KEY"

      - name: Check the metrics after the prompt
        run: bash test/metrics-check.sh after staging "$RUNNER_TEMP/metrics-before"

      - name: Close the temporary access
        if: always()
        env:
          CIDR: ${{ steps.access.outputs.cidr }}
        run: |
          for port in 6443 8001 8003; do
            aws ec2 revoke-security-group-ingress \
              --group-id "$SG" --protocol tcp --port "$port" --cidr "$CIDR" || true
          done

      - name: Record the result on the image's commit
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          [ "$JOB_STATUS" = "success" ] && state=success
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TAG" \
            -f state="$state" \
            -f context="staging-smoke-test" \
            -f description="Smoke test on staging: $state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
