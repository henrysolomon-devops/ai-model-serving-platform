<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Model Serving Platform - Chat</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --bubble-user: #3b82f6;
      --bubble-bot: #232735;
      --text: #e6e8ef;
      --muted: #8a8f9e;
      --border: #262b38;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .chat-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
    }

    .chat-header h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
    }

    .chat-header span {
      font-size: 12px;
      color: var(--muted);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.4;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--bubble-user);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bubble.bot {
      align-self: flex-start;
      background: var(--bubble-bot);
      border-bottom-left-radius: 4px;
    }

    .bubble.error {
      align-self: center;
      background: #4a1f1f;
      color: #ffb4b4;
      font-size: 13px;
    }

    .input-row {
      display: flex;
      padding: 16px;
      gap: 10px;
      border-top: 1px solid var(--border);
    }

    #message-input {
      flex: 1;
      background: #10131a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      resize: none;
    }

    #send-button {
      background: var(--bubble-user);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    #send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>Llama-3.2-3B-Instruct</h1>
      <span>Served with vLLM, running on a dedicated GPU</span>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-row">
      <textarea id="message-input" rows="1" placeholder="Type a message..."></textarea>
      <button id="send-button">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-button");

    let history = [];

    function addBubble(text, kind) {
      const div = document.createElement("div");
      div.className = "bubble " + kind;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addBubble(text, "user");
      history.push({ role: "user", content: text });
      inputEl.value = "";
      sendBtn.disabled = true;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();

        if (!res.ok) {
          addBubble(data.error || "Something went wrong.", "error");
        } else {
          addBubble(data.reply, "bot");
          history.push({ role: "assistant", content: data.reply });
        }
      } catch (err) {
        addBubble("Could not reach the chat service.", "error");
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
