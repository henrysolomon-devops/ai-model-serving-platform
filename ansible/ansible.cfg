# Skip host key confirmation prompts. The server's IP changes every
# time it gets rebuilt, so this would just be a repeated "yes/no"
# prompt with nothing useful to confirm.
[defaults]
host_key_checking = False

# Disable SSH connection reuse and add retries. Reusing one connection
# across tasks was causing "Shared connection closed" failures mid-play.
[ssh_connection]
ssh_args = -o ControlMaster=no -o ServerAliveInterval=30
retries = 5