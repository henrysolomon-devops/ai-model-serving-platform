apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-ui
  namespace: {{ required "namespace must be set" .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-ui
  template:
    metadata:
      labels:
        app: chat-ui
    spec:
      # Same node as this environment's model.
      nodeSelector:
        environment: {{ .Values.namespace }}
      containers:
        - name: chat-ui
          image: "{{ .Values.chatUI.image.repository }}:{{ required "chatUI.image.tag must be set" .Values.chatUI.image.tag }}"
          ports:
            - containerPort: {{ .Values.chatUI.port }}
          env:
            # Goes through the gateway, which picks the stable model or the canary.
            - name: MODEL_API_URL
              value: "http://model-service.{{ .Values.namespace }}.svc.cluster.local/v1/chat/completions"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-key
                  key: API_KEY
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.chatUI.port }}
            periodSeconds: 10
