name: Infrastructure (Terraform + Ansible)

# Manual on purpose, this touches real GPU-instance money. Pick apply
# to bring the three-node cluster up (Terraform, then k3s and the NVIDIA
# device plugin via Ansible), or destroy to tear everything down again.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What do you want to do with the AWS infrastructure?"
        required: true
        type: choice
        options:
          - apply
          - destroy

# Needed so this workflow can request a short-lived OIDC token from
# GitHub and hand it to AWS instead of using a stored access key.
permissions:
  id-token: write
  contents: read

# A safety net so two runs of this can't step on each other's feet if
# it gets triggered twice by accident.
concurrency:
  group: infra
  cancel-in-progress: false

env:
  ARGOCD_VERSION: v3.5.3

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: aws-infra
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # Checked first, so a missing secret fails before any GPU node exists.
      - name: Make sure the Slack webhook secrets are set
        if: inputs.action == 'apply'
        env:
          SLACK_WEBHOOK_INFRA: ${{ secrets.SLACK_WEBHOOK_INFRA }}
          SLACK_WEBHOOK_MODEL: ${{ secrets.SLACK_WEBHOOK_MODEL }}
        run: |
          for name in SLACK_WEBHOOK_INFRA SLACK_WEBHOOK_MODEL; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name repository secret is empty. Add it before applying."
              exit 1
            fi
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Get temporary AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::578254188866:role/github-actions-ai-model-serving-role
          aws-region: us-east-1

      - name: Install Ansible
        if: inputs.action == 'apply'
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Write out the SSH public key so Terraform can import it
        run: |
          mkdir -p ~/.ssh
          echo "${{ vars.SSH_PUBLIC_KEY }}" > ~/.ssh/ai-model-serving-key.pub

      - name: Terraform init
        run: terraform init

      # ---------- apply path ----------

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve -var="my_ip=${{ vars.MY_IP }}"

      - name: Get the nodes' IP addresses
        if: inputs.action == 'apply'
        id: ips
        run: |
          echo "control_plane=$(terraform output -raw control_plane_public_ip)" >> "$GITHUB_OUTPUT"
          echo "worker=$(terraform output -raw worker_public_ip)" >> "$GITHUB_OUTPUT"
          echo "canary=$(terraform output -raw canary_public_ip)" >> "$GITHUB_OUTPUT"
          echo "control_plane_private=$(terraform output -raw control_plane_private_ip)" >> "$GITHUB_OUTPUT"

      - name: Look up the security group this run needs to touch
        if: inputs.action == 'apply'
        id: sg
        run: echo "id=$(terraform output -raw security_group_id)" >> "$GITHUB_OUTPUT"

      - name: Figure out this runner's own public IP
        if: inputs.action == 'apply'
        id: runner_ip
        run: echo "cidr=$(curl -s ifconfig.me)/32" >> "$GITHUB_OUTPUT"

      - name: Temporarily let this runner SSH in, just long enough for Ansible
        if: inputs.action == 'apply'
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ steps.sg.outputs.id }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.runner_ip.outputs.cidr }}

      - name: Temporarily let this runner reach the k3s API too
        if: inputs.action == 'apply'
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ steps.sg.outputs.id }} \
            --protocol tcp --port 6443 \
            --cidr ${{ steps.runner_ip.outputs.cidr }}

      - name: Write out the SSH private key so Ansible can use it
        if: inputs.action == 'apply'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ai-model-serving-key
          chmod 600 ~/.ssh/ai-model-serving-key

      - name: Run the Ansible playbook to build the cluster and expose the GPUs
        if: inputs.action == 'apply'
        working-directory: ansible
        run: |
          ./deploy-k3s.sh \
            "${{ steps.ips.outputs.control_plane }}" \
            "${{ steps.ips.outputs.worker }}" \
            "${{ steps.ips.outputs.canary }}" \
            "${{ steps.ips.outputs.control_plane_private }}"

      - name: Create the staging and production namespaces
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/ai-model-serving-config
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      # Created here, not by the chart, so the values never touch git.
      - name: Create the hf-token and api-key secrets
        if: inputs.action == 'apply'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          export KUBECONFIG=~/.kube/ai-model-serving-config
          for ns in staging production; do
            kubectl create secret generic hf-token --from-literal=HF_TOKEN="$HF_TOKEN" \
              -n "$ns" --dry-run=client -o yaml | kubectl apply -f -
            kubectl create secret generic api-key --from-literal=API_KEY="$API_KEY" \
              -n "$ns" --dry-run=client -o yaml | kubectl apply -f -
          done

      # Alertmanager reads the Slack webhook URLs from this Secret, so they stay out of git.
      - name: Create the Slack webhook secret for Alertmanager
        if: inputs.action == 'apply'
        env:
          SLACK_WEBHOOK_INFRA: ${{ secrets.SLACK_WEBHOOK_INFRA }}
          SLACK_WEBHOOK_MODEL: ${{ secrets.SLACK_WEBHOOK_MODEL }}
        run: |
          export KUBECONFIG=~/.kube/ai-model-serving-config
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic alertmanager-slack-webhooks \
            --from-literal=infra="$SLACK_WEBHOOK_INFRA" \
            --from-literal=model="$SLACK_WEBHOOK_MODEL" \
            -n monitoring --dry-run=client -o yaml | kubectl apply -f -

      # Grafana reads its admin login from this Secret, so the password stays the same between renders.
      - name: Create the Grafana admin secret
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/ai-model-serving-config
          PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$PASSWORD"
          kubectl create secret generic grafana-admin \
            --from-literal=admin-user=admin \
            --from-literal=admin-password="$PASSWORD" \
            -n monitoring --dry-run=client -o yaml | kubectl apply -f -

      # Server-side apply is required, some Argo CD CRDs are too big for client-side.
      - name: Install Argo CD
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/ai-model-serving-config
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argocd --server-side --force-conflicts \
            -f "https://raw.githubusercontent.com/argoproj/argo-cd/${ARGOCD_VERSION}/manifests/install.yaml"
          kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=120s
          kubectl rollout status deployment/argocd-server -n argocd --timeout=300s
          kubectl rollout status deployment/argocd-repo-server -n argocd --timeout=300s
          kubectl rollout status statefulset/argocd-application-controller -n argocd --timeout=300s

      - name: Point Argo CD at the repo
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/ai-model-serving-config
          kubectl apply -f "$GITHUB_WORKSPACE/argocd/"

      - name: Save the freshly generated kubeconfig as a repo secret
        if: inputs.action == 'apply'
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          KUBECONFIG_B64=$(base64 -w 0 ~/.kube/ai-model-serving-config)
          gh secret set KUBECONFIG_B64 --body "$KUBECONFIG_B64"

      - name: Take the temporary SSH and API access back out
        if: always() && inputs.action == 'apply'
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ steps.sg.outputs.id }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.runner_ip.outputs.cidr }} || true
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ steps.sg.outputs.id }} \
            --protocol tcp --port 6443 \
            --cidr ${{ steps.runner_ip.outputs.cidr }} || true

      # ---------- destroy path ----------

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve -var="my_ip=${{ vars.MY_IP }}"
