name: Build

# Runs after a merge to main, but only when the images' inputs change.
on:
  push:
    branches: [main]
    paths:
      - model-service/**
      - chat-ui/**
      - .github/workflows/build.yml

permissions:
  contents: read

env:
  MODEL_IMAGE: ghcr.io/henrysolomon-devops/ai-model-serving-platform-model
  CHATUI_IMAGE: ghcr.io/henrysolomon-devops/ai-model-serving-platform-chat-ui

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The vLLM image is large and runners only have ~14GB free by default.
      - name: Free up disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the model service image
        run: |
          docker build -t "$MODEL_IMAGE:${{ github.sha }}" -f model-service/Dockerfile model-service
          docker push "$MODEL_IMAGE:${{ github.sha }}"

      - name: Build and push the chat UI image
        run: |
          docker build -t "$CHATUI_IMAGE:${{ github.sha }}" -f chat-ui/Dockerfile chat-ui
          docker push "$CHATUI_IMAGE:${{ github.sha }}"

  # Opens a PR that moves staging to the new image, with auto-merge on.
  bump-staging:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: bump-staging
      cancel-in-progress: false
    env:
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ secrets.ADMIN_PAT }}
      VALUES: helm/ai-model-serving/values-staging.yaml
    steps:
      # A PAT, not GITHUB_TOKEN, so the PR it opens can trigger CI.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PAT }}

      - name: Point staging at the new image tag
        run: |
          sed -i -E "s/^(    tag: ).*/\1\"$SHA\"/" "$VALUES"
          git --no-pager diff

      - name: Close older bump PRs that are still open
        run: |
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("bot/staging-")) | .number' |
          while read -r n; do
            gh pr close "$n" --delete-branch --comment "Superseded by ${SHA:0:7}"
          done

      - name: Open the PR and turn on auto-merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="bot/staging-${SHA:0:7}"
          git checkout -b "$branch"
          git commit -am "Deploy ${SHA:0:7} to staging"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Deploy ${SHA:0:7} to staging" \
            --body "Automated: moves staging to the images built from $SHA."
          gh pr merge "$branch" --auto --squash
