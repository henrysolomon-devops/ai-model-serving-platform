apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  namespace: {{ required "namespace must be set" .Values.namespace }}
spec:
  replicas: 1
  # One GPU per environment: the old pod must release it before the
  # new one can start, so a rolling update would hang in Pending.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: model-service
  template:
    metadata:
      labels:
        app: model-service
    spec:
      # Ansible labels each node environment=staging or environment=production.
      nodeSelector:
        environment: {{ .Values.namespace }}
      containers:
        - name: model-service
          image: "{{ .Values.model.image.repository }}:{{ required "model.image.tag must be set" .Values.model.image.tag }}"
          ports:
            - containerPort: {{ .Values.model.port }}
          env:
            - name: WEIGHTS_BUCKET
              value: {{ .Values.model.weightsBucket }}
            # Secrets are created outside the chart so values never touch git.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-key
                  key: API_KEY
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              nvidia.com/gpu: 1
          # A cold start may download ~6GB of weights, so give it a long window.
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.model.port }}
            periodSeconds: 15
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.model.port }}
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.model.port }}
            periodSeconds: 10
