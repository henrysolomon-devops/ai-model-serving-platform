name: CI

# Runners have no GPU, so this only checks contracts: the chat proxy against
# a fake model backend, the Helm chart, the platform manifests, the alert
# rules and the scripts.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  chat-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            chat-ui/requirements.txt
            test/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r test/requirements-dev.txt

      - name: Run contract tests
        run: python -m pytest test -v
        env:
          PYTHONPATH: chat-ui

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint and render both environments
        run: |
          for env in staging production; do
            helm lint helm/ai-model-serving -f helm/ai-model-serving/values-$env.yaml
            helm template t helm/ai-model-serving -f helm/ai-model-serving/values-$env.yaml > /dev/null
          done

      - name: Rendering without an environment file must fail
        run: "! helm template t helm/ai-model-serving"

      - name: Render production with the canary off and on
        run: |
          chart=helm/ai-model-serving
          files=(-f "$chart/values-production.yaml" -f "$chart/values-production-canary.yaml")
          helm lint "$chart" "${files[@]}"
          helm template t "$chart" "${files[@]}" > /dev/null
          helm template t "$chart" "${files[@]}" \
            --set canary.enabled=true --set canary.image.tag=abc --set canary.weight=20 > /dev/null

      - name: A canary without an image tag must fail
        run: |
          chart=helm/ai-model-serving
          ! helm template t "$chart" -f "$chart/values-production.yaml" --set canary.enabled=true

      - name: A canary weight above 100 must fail
        run: |
          chart=helm/ai-model-serving
          ! helm template t "$chart" -f "$chart/values-production.yaml" \
            --set canary.enabled=true --set canary.image.tag=abc --set canary.weight=150

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the manifests parse
        run: |
          for f in argocd/*.yaml platform/*.yaml platform/gateway/*.yaml; do
            yq '.' "$f" > /dev/null
          done

      - name: Build the KServe kustomization and check the patches
        run: |
          kubectl kustomize platform/kserve > "$RUNNER_TEMP/kserve.yaml"
          grep -q '"defaultDeploymentMode": "Standard"' "$RUNNER_TEMP/kserve.yaml"
          grep -q '"enableGatewayApi": true' "$RUNNER_TEMP/kserve.yaml"
          ! yq 'select(.kind == "DaemonSet") | .metadata.name' "$RUNNER_TEMP/kserve.yaml" \
            | grep -q kernelcachenode

      - name: The gateway name must match what KServe is told to use
        run: |
          grep -q 'name: kserve-ingress-gateway' platform/gateway/gateway.yaml
          grep -q '"kserveIngressGateway": "kserve/kserve-ingress-gateway"' platform/kserve/inferenceservice-config.yaml

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install promtool
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz \
            | tar xz -C "$HOME/bin" --strip-components=1 prometheus-3.14.0.linux-amd64/promtool
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Check the alert rules and the dashboard JSON
        run: |
          pip install pyyaml
          bash test/check-rules.sh
          python3 -m json.tool monitoring/config/dashboards/model-serving.json > /dev/null

      - name: Shellcheck
        run: |
          shellcheck model-service/entrypoint.sh ansible/deploy-k3s.sh \
            test/smoke-test.sh test/check-rules.sh test/metrics-check.sh test/canary-check.sh \
            scripts/canary-state.sh scripts/canary-plan.sh
